  .head { fill:#8b949e; font-size:15px; }
  .ascii { fill:#7ee787; font-size:12px; opacity:0; animation:appear .18s linear forwards; white-space:pre; }
  .caption { fill:#58a6ff; font-size:16px; }
  @keyframes appear { to {opacity:1} }
</style>
