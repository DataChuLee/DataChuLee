name: Update terminal profile

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate terminal profile
        run: python scripts/make_terminal_profile.py

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal-profile.svg
          git diff --cached --quiet && exit 0

          git commit -m "chore: refresh terminal profile"
          git pull --rebase origin main
          git push origin main
