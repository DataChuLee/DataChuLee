name: Update animated profile

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate ASCII profile
        run: python scripts/make_ascii_svg.py

      - name: Generate info card
        run: python scripts/make_info_card.py

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add assets/*.svg assets/contributions.json
          git diff --cached --quiet && exit 0
      
          git commit -m "chore: refresh animated profile assets"
      
          git pull --rebase origin main
          git push origin main
