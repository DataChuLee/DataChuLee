name: Update animated profile

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: animated-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portrait dependency
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap and activity card
        run: python scripts/render_heatmap_svg.py

      - name: Render current GitHub avatar
        run: python scripts/make_ascii_svg.py

      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ascii-profile.svg assets/contribution.svg assets/stats.svg assets/contributions.json
          if git diff --cached --quiet; then
            echo "Profile art is already current."
            exit 0
          fi
          git commit -m "chore: refresh animated profile [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
